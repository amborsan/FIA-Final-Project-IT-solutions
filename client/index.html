<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Orbit IT Solutions - networks, servers, cybersecurity, web development and IT support for small and medium businesses in Berlin and Germany."
    />
    <meta name="theme-color" content="#0f4c81" />
    <meta property="og:title" content="Orbit IT Solutions" />
    <meta
      property="og:description"
      content="IT services and equipment for small and medium businesses. English and German."
    />
    <meta property="og:type" content="website" />
    <title>Orbit IT Solutions — IT services & equipment</title>
    <script>
      // Apply the saved theme before React renders to avoid a light flash.
      (function () {
        try {
          var saved = localStorage.getItem("orbit_theme");
          var dark = saved
            ? saved === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          document.documentElement.setAttribute("data-theme", dark ? "orbit-dark" : "orbit");
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (error) {
          // localStorage can be blocked; the default light theme still works.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
